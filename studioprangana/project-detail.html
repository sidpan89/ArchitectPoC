<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail - Studio Prangana</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-barba="wrapper">
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main data-barba="container" data-barba-namespace="project-detail">
        <section class="project-hero animate-mask">
            <div class="animate-target"></div>
        </section>
        <section class="project-info">
            <div class="facts animate-mask">
                <h3 class="animate-target">Facts</h3>
            </div>
            <div class="concept animate-mask">
                <h3 class="animate-target">Concept</h3>
            </div>
        </section>
        <section class="project-gallery">
            <div class="grid">
                <div class="gallery-image animate-mask"><div class="animate-target"></div></div>
                <div class="gallery-image animate-mask"><div class="animate-target"></div></div>
                <div class="gallery-image animate-mask"><div class="animate-target"></div></div>
            </div>
        </section>
    </main>
    <script src="js/gsap.min.js"></script>
    <script src="js/barba.core.min.js"></script>
    <script src="js/three.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
